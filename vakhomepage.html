<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vakpagina</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e8f0ff, #ffffff);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #004aad;
      color: white;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100%;
    }

    nav {
      background: white;
      border-right: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      overflow: hidden;
    }

    nav h2 {
      margin-top: 0;
      color: #004aad;
      font-size: 1.3em;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
    }

    nav li {
      margin-bottom: 8px;
    }

    nav a {
      text-decoration: none;
      color: #004aad;
      padding: 8px 12px;
      border-radius: 8px;
      display: block;
      transition: background 0.2s;
    }

    nav a:hover {
      background: #e8f0ff;
    }

    .nav-top a {
      display: block;
      background: #004aad;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .nav-top a:hover {
      background: #005cf0;
    }

    .bottom-link {
      background: #004aad;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      text-decoration: none;
    }

    .viewer {
      position: relative;
      height: calc(100vh - 100px);
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
    }

    .download-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #004aad;
      color: white;
      padding: 10px 20px;
    }

    .download-bar button {
      background: white;
      color: #004aad;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.95em;
      cursor: pointer;
      transition: background 0.2s;
    }

    .download-bar button:hover {
      background: #e8f0ff;
    }

    #fileViewer {
      flex: 1;
      border: none;
      width: 100%;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
      color: #666;
    }

    .doc-section {
      margin-top: 20px;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }

    .doc-section h3 {
      font-size: 1.1em;
      color: #004aad;
      margin-bottom: 8px;
    }

    .doc-list {
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px;
      background: #f9fbff;
    }

    .doc-list a {
      display: block;
      color: #004aad;
      text-decoration: none;
      padding: 6px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .doc-list a:hover {
      background: #e8f0ff;
    }

    .doc-list::-webkit-scrollbar {
      width: 6px;
    }

    .doc-list::-webkit-scrollbar-thumb {
      background-color: #b5c7e3;
      border-radius: 3px;
    }

    .not-supported {
      padding: 30px;
      text-align: center;
      color: #333;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="vakTitel">Vakpagina</h1>
  </header>

  <main>
    <nav>
      <div>
        <div class="nav-top">
          <a href="index.html">🔙 Terug naar vakoverzicht</a>
        </div>

        <h2 id="vakNaam">Vaknaam</h2>
        <ul id="lesLijst"></ul>

        <div class="doc-section">
          <h3>📂 Documentatie & hulpmiddelen</h3>
          <div class="doc-list" id="docList">
            <p style="color:#666; font-size:0.9em;">Laden...</p>
          </div>
        </div>
      </div>

      <a href="#" class="bottom-link">💡 Werk om te doen als je klaar bent</a>
    </nav>

    <section class="viewer">
      <div class="download-bar" id="downloadBar">
        <span id="fileName"></span>
        <button id="downloadBtn">⬇️ Download</button>
      </div>
      <iframe id="fileViewer"></iframe>
    </section>
  </main>

  <footer>© 2025 – Schooldashboard</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const rawVak = params.get("vak") || "onbekend";

  const cleaned = rawVak.replace(/\.html$/i, "");
  let [vakNaam, klas = ""] = cleaned.split("-");

  const titelVak = vakNaam.charAt(0).toUpperCase() + vakNaam.slice(1);
  document.getElementById("vakTitel").innerText =
    `📘 ${titelVak}${klas ? " – " + klas.toUpperCase() : ""}`;
  document.getElementById("vakNaam").innerText = titelVak;

  const basePath = `${vakNaam.toLowerCase()}${klas.toLowerCase()}`;

  const lesLijst    = document.getElementById("lesLijst");
  const docList     = document.getElementById("docList");
  const viewer      = document.getElementById("fileViewer");
  const downloadBar = document.getElementById("downloadBar");
  const downloadBtn = document.getElementById("downloadBtn");
  const fileNameEl  = document.getElementById("fileName");

  /* ----------------------------
     Lessen laden
  ----------------------------- */
  fetch(`${basePath}/index.json`)
    .then(r => r.json())
    .then(data => {
      lesLijst.innerHTML = "";
      if (!Array.isArray(data) || data.length === 0) {
        const li = document.createElement("li");
        li.textContent = "Geen lessen gevonden.";
        lesLijst.appendChild(li);
        return;
      }

      data.forEach(les => {
        const li = document.createElement("li");
        const a  = document.createElement("a");
        a.href = "#";
        a.textContent = les.titel;
        a.onclick = e => {
          e.preventDefault();
          // ✅ Volledig scherm: open de les als aparte pagina
          window.location.href = les.bestand;
        };
        li.appendChild(a);
        lesLijst.appendChild(li);
      });
    })
    .catch(err => {
      console.error("Kon lessenlijst niet laden:", err);
      const li = document.createElement("li");
      li.textContent = "Geen lessen gevonden.";
      lesLijst.appendChild(li);
    });

  /* ----------------------------
     Documentatie laden
  ----------------------------- */
  fetch(`${basePath}/bestanden/index.json`)
    .then(r => r.json())
    .then(files => {
      docList.innerHTML = "";
      if (!Array.isArray(files) || files.length === 0) {
        docList.innerHTML = "<p style='color:#999;'>Geen documentatie gevonden.</p>";
        return;
      }
      files.forEach(file => {
        const a = document.createElement("a");
        a.href = "#";
        a.textContent = file.titel;
        a.onclick = e => {
          e.preventDefault();
          showFile(file.bestand, file.titel);
        };
        docList.appendChild(a);
      });
    })
    .catch(() => {
      docList.innerHTML = "<p style='color:#999;'>Geen documentatie gevonden.</p>";
    });

  /* ----------------------------
     Viewer-functies voor documenten
  ----------------------------- */
  function absUrl(rel) {
    const u = new URL(rel, window.location.href).href;
    return { raw: u, enc: encodeURIComponent(u) };
  }

  function canUseExternalViewer() {
    const isHttps = location.protocol === 'https:';
    const isLocal = location.hostname === 'localhost' ||
                    location.hostname === '127.0.0.1' ||
                    location.protocol === 'file:';
    return isHttps && !isLocal;
  }

  function showFile(url, titel) {
    const ext = url.split('.').pop().toLowerCase();
    const { raw, enc } = absUrl(url);

    const officeTypes = ["doc","docx","xls","xlsx","ppt","pptx"];
    const imageTypes  = ["png","jpg","jpeg","gif","webp","bmp","svg"];
    const textTypes   = ["txt","csv","md","json"];
    const pdfTypes    = ["pdf"];

    fileNameEl.textContent = titel;
    downloadBar.style.display = "flex";
    downloadBtn.onclick = () => downloadFile(raw);

    if (pdfTypes.includes(ext) || imageTypes.includes(ext) || textTypes.includes(ext)) {
      viewer.src = raw; return;
    }
    if (officeTypes.includes(ext) && canUseExternalViewer()) {
      viewer.src = `https://view.officeapps.live.com/op/embed.aspx?src=${enc}`; return;
    }

    viewer.srcdoc = `
      <div class='not-supported' style="padding:30px;text-align:center;">
        <h2>📁 Dit bestand kan hier niet worden weergegeven</h2>
        <p>Open of download het bestand via onderstaande knoppen.</p>
        <p style="margin-top:20px;">
          <a href="${raw}" target="_blank"
             style="text-decoration:none; background:#004aad; color:white; padding:8px 12px; border-radius:6px;">
             🔗 Open in nieuw tabblad
          </a>
          &nbsp;
          <a href="${raw}" download
             style="text-decoration:none; background:#009961; color:white; padding:8px 12px; border-radius:6px;">
             ⬇️ Download
          </a>
        </p>
      </div>`;
  }

  function downloadFile(url) {
    const link = document.createElement("a");
    link.href = url;
    link.download = url.split("/").pop();
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  /* ----------------------------
     Default startpagina
  ----------------------------- */
  const defaultHome = klas
    ? `${vakNaam.toLowerCase()}-${klas.toLowerCase()}.html`
    : `${vakNaam.toLowerCase()}.html`;

  viewer.src = defaultHome;
</script>

</body>
</html>
