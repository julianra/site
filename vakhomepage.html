<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vakpagina</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e8f0ff, #ffffff);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #004aad;
      color: white;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
      height: 100%;
    }

    nav {
      background: white;
      border-right: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    nav h2 {
      margin-top: 0;
      color: #004aad;
      font-size: 1.3em;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
    }

    nav li {
      margin-bottom: 10px;
    }

    nav a {
      text-decoration: none;
      color: #004aad;
      padding: 8px 12px;
      border-radius: 8px;
      display: block;
      transition: background 0.2s;
    }

    nav a:hover {
      background: #e8f0ff;
    }

    .bottom-link {
      background: #004aad;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      text-decoration: none;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 100px);
      border: none;
      background: #f8f9fa;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="vakTitel">Vakpagina</h1>
  </header>

  <main>
    <nav>
      <div>
        <h2 id="vakNaam">Vaknaam</h2>
        <ul id="lesLijst">
          <!-- lessen worden hier dynamisch geladen -->
        </ul>
      </div>
      <a href="#" class="bottom-link">💡 Werk om te doen als je klaar bent</a>
    </nav>

    <section>
      <iframe id="contentFrame" src=""></iframe>
    </section>
  </main>

  <footer>© 2025 – Schooldashboard</footer>

  <script>
    // URL-parameter uitlezen
    const params = new URLSearchParams(window.location.search);
    const vakParam = params.get("vak") || "onbekend";
    const [vakNaam, klas] = vakParam.split("-");

    document.getElementById("vakTitel").innerText = `📘 ${vakNaam.replace(/^\w/, c => c.toUpperCase())} – ${klas.toUpperCase()}`;
    document.getElementById("vakNaam").innerText = vakNaam.replace(/^\w/, c => c.toUpperCase());

    // Lesbestanden per vak (pas aan per jouw structuur)
    const lessen = {
      digitalevaardigheden: [
        { titel: "Word 1", bestand: "digitalevaardigheden/word1.html" },
        { titel: "Excel 1", bestand: "digitalevaardigheden/excel1.html" },
        { titel: "Excel 7", bestand: "digitalevaardigheden/excel7.html" }
      ],
      techniek: [
        { titel: "Schakelingen", bestand: "techniek/schakelingen.html" },
        { titel: "Materialen", bestand: "techniek/materialen.html" },
        { titel: "Projecten", bestand: "techniek/projecten.html" }
      ],
      stem: [
        { titel: "Sensoren", bestand: "stem/sensoren.html" },
        { titel: "3D-print", bestand: "stem/3dprint.html" }
      ]
    };

    const lesLijst = document.getElementById("lesLijst");
    const lijst = lessen[vakNaam] || [];

    lijst.forEach(les => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = les.titel;
      a.onclick = () => {
        document.getElementById("contentFrame").src = les.bestand;
        return false;
      };
      li.appendChild(a);
      lesLijst.appendChild(li);
    });

    // Standaard de welkomspagina laden
    document.getElementById("contentFrame").src = `${vakNaam}-${klas}.html`;
  </script>
</body>
</html>
