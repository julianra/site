<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Techniek – Les 3: Van 2D naar 3D</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #e8f0ff, #ffffff);
      color: #003366;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #004aad;
      color: white;
      text-align: center;
      padding: 20px;
      position: sticky;
      top: 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    #clock {
      font-size: 1em;
      color: #e0e6ff;
      margin-top: 5px;
    }

    #content {
      flex: 1;
      max-width: 900px;
      margin: 40px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 30px;
      animation: fadeIn 0.4s ease;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #f4f8ff;
      border-top: 1px solid #ccc;
      position: sticky;
      bottom: 0;
    }

    button {
      background-color: #004aad;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #003a8c;
    }

    #timer {
      font-weight: bold;
      font-size: 1.1em;
      color: #004aad;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
      color: #666;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ Techniek – Les 3: Van 2D naar 3D</h1>
    <div id="clock">🕒 10:20</div>
  </header>

  <main id="content">
    <!-- Lesdeel wordt hier geladen -->
  </main>

  <nav>
    <button id="prevBtn">⬅ Vorige</button>
    <div id="timer">00:00</div>
    <button id="nextBtn">Volgende ➡</button>
  </nav>

  <footer>
    © 2025 – Techniek 1A/B | Les 3: Van 2D naar 3D
  </footer>

 <script>
  // -------------------------------------------------------
  // Configuratie
  // -------------------------------------------------------
  const startLes = new Date();
  startLes.setHours(10, 20, 0, 0); // start om 10u20

  const lesdelen = [
    { bestand: "lesdeel/lesdeel1.html", duur: 10 },
    { bestand: "lesdeel/lesdeel2.html", duur: 10 },
    { bestand: "lesdeel/lesdeel3.html", duur: 10 },
    { bestand: "lesdeel/lesdeel4.html", duur: 10 }
  ];

  const content = document.getElementById("content");
  const timerEl = document.getElementById("timer");
  const clockEl = document.getElementById("clock");

  let current = 0;
  let autoSync = true;
  let afbeeldingen = ["ref/vorm1.jpg", "ref/vorm2.png", "ref/vorm3.jpg"];
  let vormIndex = 0;

  // -------------------------------------------------------
  // Huidig lesdeel bepalen op basis van tijd
  // -------------------------------------------------------
  function bepaalHuidigLesdeel() {
    const now = new Date();
    const diffMinuten = (now - startLes) / 60000;
    let cumul = 0;
    for (let i = 0; i < lesdelen.length; i++) {
      cumul += lesdelen[i].duur;
      if (diffMinuten < cumul) return i;
    }
    return lesdelen.length - 1;
  }

  // -------------------------------------------------------
  // Lesdeel laden
  // -------------------------------------------------------
  function loadLesdeel(index) {
    fetch(lesdelen[index].bestand)
      .then(res => res.text())
      .then(html => {
        content.innerHTML = html;
        koppelInteracties(); // activeer eventlisteners van dat deel
      })
      .catch(() => {
        content.innerHTML = "<p style='color:red;'>❌ Dit lesdeel kon niet geladen worden.</p>";
      });
  }

  // -------------------------------------------------------
  // Koppeling met interactieve elementen in lesdelen
  // -------------------------------------------------------
  function koppelInteracties() {
    // voorbeeld: knop voor volgende vorm (alleen aanwezig in lesdeel4)
    const nextVormBtn = content.querySelector("#nextVormBtn");
    const foto = content.querySelector("#vormFoto");

    if (nextVormBtn && foto) {
      nextVormBtn.addEventListener("click", () => {
        vormIndex = (vormIndex + 1) % afbeeldingen.length;
        foto.src = afbeeldingen[vormIndex];
      });
    }
  }

  // -------------------------------------------------------
  // Klok & countdown
  // -------------------------------------------------------
  function updateTimers() {
    const now = new Date();
    clockEl.textContent = `🕒 ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;

    const huidig = bepaalHuidigLesdeel();
    if (autoSync && huidig !== current) {
      current = huidig;
      loadLesdeel(current);
    }

    let beginMin = 0;
    for (let i = 0; i < current; i++) beginMin += lesdelen[i].duur;
    const deelStart = new Date(startLes.getTime() + beginMin * 60000);
    const deelEinde = new Date(deelStart.getTime() + lesdelen[current].duur * 60000);

    const remainingSec = Math.max(0, Math.floor((deelEinde - now) / 1000));
    const minLeft = Math.floor(remainingSec / 60);
    const secLeft = remainingSec % 60;
    timerEl.textContent = `${String(minLeft).padStart(2, "0")}:${String(secLeft).padStart(2, "0")}`;

    // kleurcodes
    timerEl.style.color =
      remainingSec <= 0 ? "#d90429" :
      remainingSec < 120 ? "#e63946" :
      remainingSec < 300 ? "#f1c40f" :
      "#009961";

    requestAnimationFrame(updateTimers);
  }

  // -------------------------------------------------------
  // Navigatie
  // -------------------------------------------------------
  document.getElementById("nextBtn").addEventListener("click", () => {
    if (current < lesdelen.length - 1) {
      autoSync = false;
      current++;
      loadLesdeel(current);
    }
  });

  document.getElementById("prevBtn").addEventListener("click", () => {
    if (current > 0) {
      autoSync = false;
      current--;
      loadLesdeel(current);
    }
  });

  timerEl.addEventListener("dblclick", () => (autoSync = true));

  // -------------------------------------------------------
  // Start
  // -------------------------------------------------------
  current = bepaalHuidigLesdeel();
  loadLesdeel(current);
  updateTimers();
</script>


</body>
</html>
